<nav>

  <!-- Botão hamburguer -->
  <button
    type="button"
    (click)="toggleMenu()"
    class="
      fixed
      top-5
      left-5
      z-40
      flex
      h-11
      w-11
      items-center
      justify-center
      rounded-full
      bg-white
      text-xl
      text-stone-700
      shadow-md
      transition
      duration-300
      hover:scale-105
      hover:text-rose-500
    "
    aria-label="Abrir menu"
  >
    <i class="fa-solid fa-bars"></i>
  </button>


  <!-- Fundo escuro -->
  <div
    *ngIf="isMenuOpen"
    (click)="closeMenu()"
    class="
      fixed
      inset-0
      z-40
      bg-black/40
      backdrop-blur-[1px]
    "
  ></div>


  <!-- Menu lateral -->
  <aside
    class="
      fixed
      top-0
      left-0
      z-50
      flex
      h-screen
      w-72
      max-w-[85vw]
      flex-col
      bg-[#fffaf7]
      shadow-2xl
      transition-transform
      duration-300
      ease-in-out
    "
    [class.-translate-x-full]="!isMenuOpen"
    [class.translate-x-0]="isMenuOpen"
  >

    <!-- Cabeçalho -->
    <div
      class="
        flex
        items-center
        justify-between
        border-b
        border-stone-200
        px-6
        py-6
      "
    >

      <div>

        <span
          class="
            text-xs
            uppercase
            tracking-[0.25em]
            text-rose-400
          "
        >
          Nosso casamento
        </span>

        <h2
          class="
            mt-1
            text-2xl
            font-semibold
            text-stone-800
          "
        >
          João & Vitória
        </h2>

      </div>


      <!-- Botão fechar -->
      <button
        type="button"
        (click)="closeMenu()"
        class="
          flex
          h-9
          w-9
          items-center
          justify-center
          rounded-full
          text-lg
          text-stone-500
          transition
          duration-200
          hover:bg-rose-50
          hover:text-rose-500
        "
        aria-label="Fechar menu"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>

    </div>


    <!-- Links -->
    <ul
      class="
        flex-1
        space-y-1
        overflow-y-auto
        px-4
        py-6
      "
    >

      <li>
        <a
          href="#home"
          (click)="closeMenu()"
          class="
            flex
            items-center
            gap-4
            rounded-xl
            px-4
            py-3
            text-base
            text-stone-700
            transition-all
            duration-200
            hover:bg-rose-50
            hover:pl-5
            hover:text-rose-500
          "
        >
          <i class="fa-solid fa-house w-5 text-center text-rose-400"></i>

          <span>Início</span>
        </a>
      </li>


      <li>
        <a
          href="#our-history"
          (click)="closeMenu()"
          class="
            flex
            items-center
            gap-4
            rounded-xl
            px-4
            py-3
            text-base
            text-stone-700
            transition-all
            duration-200
            hover:bg-rose-50
            hover:pl-5
            hover:text-rose-500
          "
        >
          <i class="fa-solid fa-heart w-5 text-center text-rose-400"></i>

          <span>Nossa História</span>
        </a>
      </li>


      <li>
        <a
          routerLink="/padrinhos"
          (click)="closeMenu()"
          class="
            flex
            items-center
            gap-4
            rounded-xl
            px-4
            py-3
            text-base
            text-stone-700
            transition-all
            duration-200
            hover:bg-rose-50
            hover:pl-5
            hover:text-rose-500
          "
        >
          <i class="fa-solid fa-people-group w-5 text-center text-rose-400"></i>

          <span>Padrinhos</span>
        </a>
      </li>


      <li>
        <a
          routerLink="/cerimonia"
          (click)="closeMenu()"
          class="
            flex
            items-center
            gap-4
            rounded-xl
            px-4
            py-3
            text-base
            text-stone-700
            transition-all
            duration-200
            hover:bg-rose-50
            hover:pl-5
            hover:text-rose-500
          "
        >
          <i class="fa-solid fa-church w-5 text-center text-rose-400"></i>

          <span>Cerimônia</span>
        </a>
      </li>


      <li>
        <a
          routerLink="/recepcao"
          (click)="closeMenu()"
          class="
            flex
            items-center
            gap-4
            rounded-xl
            px-4
            py-3
            text-base
            text-stone-700
            transition-all
            duration-200
            hover:bg-rose-50
            hover:pl-5
            hover:text-rose-500
          "
        >
          <i class="fa-solid fa-champagne-glasses w-5 text-center text-rose-400"></i>

          <span>Recepção</span>
        </a>
      </li>


      <li>
        <a
          href="#wedding-gifts"
          (click)="closeMenu()"
          class="
            flex
            items-center
            gap-4
            rounded-xl
            px-4
            py-3
            text-base
            text-stone-700
            transition-all
            duration-200
            hover:bg-rose-50
            hover:pl-5
            hover:text-rose-500
          "
        >
          <i class="fa-solid fa-gift w-5 text-center text-rose-400"></i>

          <span>Presentes</span>
        </a>
      </li>


      <li>
        <a
          routerLink="/contato"
          (click)="closeMenu()"
          class="
            flex
            items-center
            gap-4
            rounded-xl
            px-4
            py-3
            text-base
            text-stone-700
            transition-all
            duration-200
            hover:bg-rose-50
            hover:pl-5
            hover:text-rose-500
          "
        >
          <i class="fa-solid fa-envelope w-5 text-center text-rose-400"></i>

          <span>Contato</span>
        </a>
      </li>

    </ul>


    <!-- Rodapé -->
    <div
      class="
        flex
        items-center
        justify-center
        gap-2
        border-t
        border-stone-200
        px-6
        py-5
        text-sm
        text-stone-500
      "
    >
      <i class="fa-solid fa-heart text-rose-400"></i>

      <span>14 • 03 • 2027</span>
    </div>

  </aside>

</nav>
